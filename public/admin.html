<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Panel · Torneo Beer Pong</title>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <!-- Puerta de PIN -->
  <div id="pinGate" class="pin-gate">
    <div class="pin-box">
      <div class="pin-cup">🍺</div>
      <h1>Panel de administración</h1>
      <p>Ingresa el PIN para controlar el torneo.</p>
      <input id="pinInput" type="tel" inputmode="numeric" placeholder="PIN" maxlength="8" />
      <button id="pinBtn" class="btn btn-primary btn-block">Entrar</button>
      <div id="pinErr" class="pin-err"></div>
    </div>
  </div>

  <!-- App -->
  <div id="admin" class="admin hidden">
    <header class="adm-header">
      <div>
        <div id="hName" class="adm-name">Torneo</div>
        <div id="hStatus" class="adm-status"></div>
      </div>
      <div class="adm-header-btns">
        <button id="themeBtn" class="btn btn-sm btn-ghost" title="Modo claro/oscuro">🌙</button>
        <button id="undoBtn" class="btn btn-sm btn-ghost">↩︎ Deshacer</button>
      </div>
    </header>

    <main id="view" class="adm-view"></main>

    <nav class="adm-tabs">
      <button class="tab-btn active" data-tab="matches">🎯<span>Partidos</span></button>
      <button class="tab-btn" data-tab="players">👥<span>Jugadores</span></button>
      <button class="tab-btn" data-tab="standings">🏅<span>Posiciones</span></button>
      <button class="tab-btn" data-tab="settings">⚙️<span>Ajustes</span></button>
      <button class="tab-btn" data-tab="history">🕘<span>Historial</span></button>
    </nav>
  </div>

  <!-- Modal generico -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn btn-ghost">Cancelar</button>
        <button id="modalOk" class="btn btn-primary">Aceptar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
